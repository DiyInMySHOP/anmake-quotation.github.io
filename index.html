<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบเสนอราคา งานปักผ้า แอนเมค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--ink:#1d2742;--thread:#c8372d;--bg:#e9edf3;--line:#d5dbe6;--muted:#5d6879;--panel:#fff;--field:#f7f9fc}
@media (prefers-color-scheme:dark){:root:not([data-x]){--bg:#12161f;--panel:#1b2130;--line:#303a50;--muted:#9aa5b8;--field:#222a3c;--ink:#e6ebf5}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.app{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.form h1{font-size:20px;margin:0 0 4px}
.form h2{font-size:15px;margin:18px 0 8px;padding-top:12px;border-top:1px dashed var(--line)}
.form p.sub{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--thread);outline-offset:1px}
textarea{resize:vertical;min-height:60px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--field)}
.item .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item input{background:var(--panel)}
.item .top{display:flex;gap:8px;align-items:center}
.btn{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:inherit;padding:8px 12px}
.btn.primary{background:var(--thread);border-color:var(--thread);color:#fff;font-weight:700;width:100%;padding:12px;font-size:16px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}
.btn.save{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
details.saved{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field)}
details.saved summary{cursor:pointer;font-weight:500}
.sv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.sv:first-of-type{margin-top:8px}
.sv small{color:var(--muted)}
.sv.cur{background:rgba(200,55,45,.08);margin:0 -6px;padding:8px 6px;border-radius:6px}
.sv .acts{display:flex;gap:6px;flex:none}
.sv .btn{padding:4px 10px;font-size:13px}
.bk{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bk .btn{font-size:13px;padding:5px 10px}
#msg{min-height:20px;font-size:13px;color:var(--thread);margin-top:6px}
.btn.del{color:var(--thread);padding:6px 10px;flex:none}
.check{display:flex;gap:8px;align-items:center;margin:10px 0 0;color:var(--ink)}
.check input{width:auto}
.preview{overflow-x:auto;padding:0;background:transparent;border:0}
.paper{width:794px;min-height:1120px;background:#fff;color:#1d2742;margin:0 auto;padding:44px 48px;font-size:14px;line-height:1.45;box-shadow:0 2px 14px rgba(20,30,60,.18);position:relative}
.paper *{color:inherit}
.p-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #c8372d;padding-bottom:14px}
.p-shop{font-size:26px;font-weight:700;line-height:1.1}
.p-shop small{display:block;font-size:13px;font-weight:400;margin-top:6px;color:#5d6879}
.p-title{text-align:right}
.p-title b{font-size:24px;letter-spacing:.5px;color:#c8372d}
.p-title div{font-size:13px;margin-top:4px}
.p-meta{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin:16px 0}
.p-meta .lbl{font-size:12px;color:#5d6879}
.p-meta .box{border:1px solid #d5dbe6;border-radius:6px;padding:10px 12px;min-height:84px;white-space:pre-line}
table.t{width:100%;border-collapse:collapse;margin-top:6px}
.t th{background:#1d2742;color:#fff !important;font-weight:500;padding:7px 8px;font-size:13px;text-align:left}
.t th *{color:#fff}
.t td{padding:8px;border-bottom:1px solid #d5dbe6;vertical-align:top}
.t .n{text-align:right;white-space:nowrap}
.t .c{text-align:center}
.t td small{display:block;color:#5d6879;font-size:12px}
.p-sum{display:flex;justify-content:space-between;gap:24px;margin-top:14px}
.p-words{flex:1;border:1px dashed #b9c2d3;border-radius:6px;padding:10px 12px;align-self:flex-start;font-size:13px}
.p-tot{width:280px}
.p-tot div{display:flex;justify-content:space-between;padding:4px 0}
.p-tot .g{border-top:2px solid #1d2742;margin-top:4px;padding-top:8px;font-size:17px;font-weight:700}
.p-notes{margin-top:18px;font-size:13px;white-space:pre-line}
.p-notes b{display:block;margin-bottom:2px}
.p-sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:56px;text-align:center;font-size:13px}
.p-sign div{border-top:1px solid #1d2742;padding-top:6px}
</style>
</head>
<body>
<div class="app">
<form class="panel form" id="form" onsubmit="return false">
  <h1>ใบเสนอราคา งานปักผ้า</h1>
  <p class="sub">กรอกข้อมูล ตัวอย่างใบเสนอราคาจะอัปเดตทางขวาทันที</p>
  <div class="bar"><button type="button" class="btn save" id="save">บันทึกใบนี้</button><button type="button" class="btn" id="new">+ ใบใหม่</button></div>
  <div id="msg" role="status"></div>
  <details class="saved" id="savedBox"><summary>ใบที่บันทึกไว้ (<span id="cnt">0</span>)</summary><div id="list"></div>
    <div class="bk"><button type="button" class="btn" id="exp">สำรองข้อมูล (ไฟล์)</button><button type="button" class="btn" id="imp">นำเข้าข้อมูล</button><input type="file" id="file" accept=".json,application/json" hidden></div></details>

  <h2>ข้อมูลร้าน</h2>
  <label>ชื่อร้าน</label><input data-k="shop" value="แอนเมค">
  <label>ที่อยู่</label><textarea data-k="addr" rows="2"></textarea>
  <div class="row"><div><label>เบอร์โทร</label><input data-k="tel"></div><div><label>เลขผู้เสียภาษี (ถ้ามี)</label><input data-k="tax"></div></div>

  <h2>ลูกค้า</h2>
  <label>ชื่อลูกค้า / บริษัท</label><input data-k="cust">
  <label>ที่อยู่ / เบอร์ติดต่อ</label><textarea data-k="custInfo" rows="2"></textarea>
  <label>เลขประจำตัวผู้เสียภาษีลูกค้า (ถ้ามี)</label><input data-k="custTax" inputmode="numeric">
  <div class="row"><div><label>เลขที่ใบเสนอราคา</label><input data-k="no"></div><div><label>วันที่</label><input type="date" data-k="date"></div></div>
  <label>ยืนราคา (วัน)</label><input type="number" min="0" data-k="valid" value="15">

  <h2>รายการงานปัก</h2>
  <div id="items"></div>
  <button type="button" class="btn" id="add">+ เพิ่มรายการ</button>

  <h2>สรุปยอด</h2>
  <div class="row"><div><label>ส่วนลด (บาท)</label><input type="number" min="0" data-k="disc" value="0"></div><div><label>มัดจำ (%)</label><input type="number" min="0" max="100" data-k="dep" value="50"></div></div>
  <label class="check"><input type="checkbox" data-k="vat"> คิด VAT 7%</label>
  <label class="check"><input type="checkbox" data-k="urgent"> งานด่วน (ชำระเต็มจำนวน)</label>

  <h2>หมายเหตุและเงื่อนไข</h2>
  <textarea data-k="notes" rows="5"></textarea>

  <div style="margin-top:18px"><button type="button" class="btn primary" id="pdf">ดาวน์โหลด PDF</button></div>
  <p class="sub" style="margin-top:8px">ข้อมูลร้านและเงื่อนไขจะถูกจำไว้ในเบราว์เซอร์นี้</p>
</form>

<div class="panel preview"><div class="paper" id="paper"></div></div>
</div>

<script>
const DEF_NOTES="• ชำระมัดจำก่อนเริ่มผลิต ส่วนที่เหลือชำระเมื่อรับงาน\n• ระยะเวลาผลิตประมาณ 7-10 วันทำการ หลังยืนยันแบบและชำระมัดจำ\n• ราคานี้รวมค่าทำตัวอย่างปัก (ถ้ามี) ตามที่ระบุในรายการ\n• งานที่ปักตามแบบที่ลูกค้ายืนยันแล้ว ไม่รับคืน/เปลี่ยน";
const S={shop:"แอนเมค",addr:"",tel:"",tax:"",cust:"",custInfo:"",custTax:"",no:"",date:"",valid:15,disc:0,dep:50,vat:false,urgent:false,notes:DEF_NOTES,
  items:[{d:"ปักโลโก้อกซ้าย",s:"ขนาด 8×8 ซม.",q:50,p:35}]};
const KEEP=["shop","addr","tel","tax","notes"];
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
try{const sv=JSON.parse(localStorage.getItem("anmake-quote")||"{}");KEEP.forEach(k=>{if(sv[k]!=null)S[k]=sv[k]})}catch(e){}
S.date=today();
S.no=nextNo();

const fmt=n=>(+n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function thaiDate(v){if(!v)return"";const[y,m,d]=v.split("-");const M=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];return`${+d} ${M[m-1]} ${+y+543}`}
function bahtText(n){
  n=Math.round((+n||0)*100)/100;if(n===0)return"ศูนย์บาทถ้วน";
  const D=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"],U=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  const grp=s=>{let r="",l=s.length;for(let i=0;i<l;i++){const d=+s[i],p=l-i-1;if(!d)continue;
    if(p===0&&d===1&&l>1)r+="เอ็ด";else if(p===1&&d===2)r+="ยี่";else if(p===1&&d===1)r+="";else r+=D[d];r+=U[p]}return r};
  const th=s=>{if(s.length<=6)return grp(s);return th(s.slice(0,-6))+"ล้าน"+grp(s.slice(-6).replace(/^0+(?=\d)/,"")===""?"":s.slice(-6))};
  const[b,st]=n.toFixed(2).split(".");let r=(+b?th(b)+"บาท":"");
  r+= +st? grp(st)+"สตางค์":"ถ้วน";return r}

function calc(q=S){
  const sub=q.items.reduce((a,i)=>a+(+i.q||0)*(+i.p||0),0),disc=Math.min(+q.disc||0,sub),after=sub-disc;
  const vat=q.vat?after*0.07:0,total=after+vat,dep=total*(q.urgent?100:(+q.dep||0))/100;return{sub,disc,vat,total,dep,rest:total-dep}}

function render(){
  const c=calc();$("[data-k=dep]").disabled=S.urgent;
  const rows=S.items.map((i,n)=>`<tr><td class="c">${n+1}</td><td>${esc(i.d)||"-"}${i.s?`<small>${esc(i.s)}</small>`:""}</td><td class="c">${+i.q||0}</td><td class="n">${fmt(i.p)}</td><td class="n">${fmt((+i.q||0)*(+i.p||0))}</td></tr>`).join("");
  $("#paper").innerHTML=`
  <div class="p-head"><div class="p-shop">${esc(S.shop)||"ชื่อร้าน"}<small>${esc(S.addr).replace(/\n/g,"<br>")}${S.tel?`<br>โทร ${esc(S.tel)}`:""}${S.tax?`<br>เลขประจำตัวผู้เสียภาษี ${esc(S.tax)}`:""}</small></div>
    <div class="p-title"><b>ใบเสนอราคา</b><div>เลขที่ ${esc(S.no)}</div><div>วันที่ ${thaiDate(S.date)}</div>${+S.valid?`<div>ยืนราคา ${+S.valid} วัน</div>`:""}${S.urgent?`<div style="color:#c8372d;font-weight:700;font-size:15px">งานด่วน</div>`:""}</div></div>
  <div class="p-meta"><div><div class="lbl">เสนอราคาให้</div><div class="box"><b>${esc(S.cust)||"-"}</b>\n${esc(S.custInfo)}${S.custTax?`\nเลขประจำตัวผู้เสียภาษี ${esc(S.custTax)}`:""}</div></div>
    <div><div class="lbl">ประเภทงาน</div><div class="box">งานปักผ้า (Embroidery)${S.urgent?"\n<b style=\"color:#c8372d\">งานด่วน</b>":""}</div></div></div>
  <table class="t"><thead><tr><th style="width:40px;text-align:center">ลำดับ</th><th>รายการ</th><th style="width:70px;text-align:center">จำนวน</th><th style="width:100px;text-align:right">ราคา/หน่วย</th><th style="width:110px;text-align:right">รวม (บาท)</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="p-sum"><div class="p-words">ตัวอักษร: <b>${bahtText(c.total)}</b></div>
    <div class="p-tot"><div><span>รวมเป็นเงิน</span><span>${fmt(c.sub)}</span></div>
    ${c.disc?`<div><span>ส่วนลด</span><span>-${fmt(c.disc)}</span></div>`:""}
    ${S.vat?`<div><span>ภาษีมูลค่าเพิ่ม 7%</span><span>${fmt(c.vat)}</span></div>`:""}
    <div class="g"><span>ยอดสุทธิ</span><span>${fmt(c.total)}</span></div>
    ${S.urgent?`<div><span>งานด่วน ชำระเต็มจำนวน</span><span>${fmt(c.total)}</span></div>`:+S.dep?`<div><span>มัดจำ ${+S.dep}%</span><span>${fmt(c.dep)}</span></div><div><span>ชำระเมื่อรับงาน</span><span>${fmt(c.rest)}</span></div>`:""}</div></div>
  ${S.notes.trim()||S.urgent?`<div class="p-notes"><b>หมายเหตุ / เงื่อนไข</b>${S.urgent?"• งานด่วน: ชำระเต็มจำนวนก่อนเริ่มผลิต\n":""}${esc(S.notes)}</div>`:""}
  <div class="p-sign"><div>ผู้สั่งซื้อ / วันที่</div><div>ผู้เสนอราคา ${esc(S.shop)} / วันที่</div></div>`}

function renderItems(){
  $("#items").innerHTML=S.items.map((i,n)=>`<div class="item" data-n="${n}">
   <div class="top"><input data-f="d" placeholder="เช่น ปักโลโก้อกซ้าย" value="${esc(i.d)}"><button type="button" class="btn del" data-del aria-label="ลบรายการ">ลบ</button></div>
   <label>รายละเอียด (ขนาด / ตำแหน่ง / จำนวนสี)</label><input data-f="s" value="${esc(i.s)}">
   <div class="row3"><div><label>จำนวน</label><input type="number" min="0" data-f="q" value="${i.q}"></div><div><label>ราคา/หน่วย</label><input type="number" min="0" step="0.01" data-f="p" value="${i.p}"></div><div><label>รวม</label><input disabled value="${fmt((+i.q||0)*(+i.p||0))}"></div></div></div>`).join("")}

function save(){try{const o={};KEEP.forEach(k=>o[k]=S[k]);localStorage.setItem("anmake-quote",JSON.stringify(o))}catch(e){}}
document.querySelectorAll("[data-k]").forEach(el=>{
  const k=el.dataset.k;if(el.type==="checkbox")el.checked=S[k];else el.value=S[k];
  el.addEventListener("input",()=>{S[k]=el.type==="checkbox"?el.checked:el.value;save();render()})});
$("#items").addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;const it=e.target.closest(".item");
  S.items[+it.dataset.n][f]=e.target.value;const i=S.items[+it.dataset.n];
  it.querySelector("input:disabled").value=fmt((+i.q||0)*(+i.p||0));render()});
$("#items").addEventListener("click",e=>{if(!e.target.matches("[data-del]"))return;
  S.items.splice(+e.target.closest(".item").dataset.n,1);renderItems();render()});
$("#add").onclick=()=>{S.items.push({d:"",s:"",q:1,p:0});renderItems();render()};

$("#pdf").onclick=async()=>{
  const b=$("#pdf");b.disabled=true;b.textContent="กำลังสร้าง PDF...";
  const wrap=document.createElement("div");
  wrap.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff";
  const clone=$("#paper").cloneNode(true);
  clone.style.cssText="box-shadow:none;margin:0;width:794px;min-height:1120px";
  wrap.appendChild(clone);document.body.appendChild(wrap);
  try{
    await document.fonts.ready;
    await html2pdf().set({margin:0,filename:`ใบเสนอราคา_${S.no}_${S.cust||"ลูกค้า"}.pdf`,image:{type:"jpeg",quality:.98},
      html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0,x:0,y:0,windowWidth:794,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css"]}}).from(clone).save();
    if(S.cust.trim())saveQuote(true);
  }catch(e){alert("สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง หรือกด Ctrl+P แล้วเลือก Save as PDF")}
  wrap.remove();b.disabled=false;b.textContent="ดาวน์โหลด PDF"};


function getList(){try{return JSON.parse(localStorage.getItem("anmake-list")||"[]")}catch(e){return[]}}
function putList(l){try{localStorage.setItem("anmake-list",JSON.stringify(l));return true}catch(e){msg("บันทึกไม่ได้ พื้นที่เบราว์เซอร์อาจเต็มหรือปิดการจดจำข้อมูล");return false}}
function nextNo(){const y=(S.date||today()).slice(0,4),pre="AM"+y+"-";
  const mx=getList().map(q=>q.no||"").filter(n=>n.startsWith(pre)).map(n=>parseInt(n.slice(pre.length))||0);
  return pre+String((mx.length?Math.max(...mx):0)+1).padStart(3,"0")}
let mt;function msg(t){const m=$("#msg");m.textContent=t;clearTimeout(mt);mt=setTimeout(()=>m.textContent="",4000)}
function syncForm(){document.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(el.type==="checkbox")el.checked=!!S[k];else el.value=S[k]??""});renderItems();render();drawList()}
function saveQuote(silent){
  if(!S.cust.trim()){if(!silent){msg("ใส่ชื่อลูกค้าก่อนบันทึก");document.querySelector("[data-k=cust]").focus()}return}
  const l=getList(),q=JSON.parse(JSON.stringify(S));q.savedAt=Date.now();
  const i=l.findIndex(x=>x.no===q.no);const upd=i>=0;if(upd)l[i]=q;else l.push(q);
  if(putList(l)){drawList();msg(silent?"":(upd?"อัปเดตใบเสนอราคา "+q.no+" แล้ว":"บันทึกใบเสนอราคา "+q.no+" แล้ว"))}}
function openQuote(no){const q=getList().find(x=>x.no===no);if(!q)return;
  const keep={};KEEP.forEach(k=>keep[k]=S[k]);
  Object.assign(S,{custTax:"",urgent:false},JSON.parse(JSON.stringify(q)));delete S.savedAt;
  syncForm();window.scrollTo({top:0,behavior:"smooth"});msg("เปิด "+no+" แล้ว แก้ไขแล้วกด \"บันทึกใบนี้\" เพื่ออัปเดต")}
function newQuote(){
  Object.assign(S,{cust:"",custInfo:"",custTax:"",date:today(),valid:15,disc:0,dep:50,vat:false,urgent:false,items:[{d:"",s:"",q:1,p:0}]});
  S.no=nextNo();syncForm();msg("เริ่มใบใหม่ "+S.no)}
function drawList(){
  const l=getList().sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));$("#cnt").textContent=l.length;
  $("#list").innerHTML=l.length?l.map(q=>`<div class="sv${q.no===S.no?" cur":""}"><div><b>${esc(q.no)}</b> ${esc(q.cust)}<br><small>${thaiDate(q.date)} • ${fmt(calc(q).total)} บาท${q.urgent?" • ด่วน":""}</small></div><div class="acts"><button type="button" class="btn" data-open="${esc(q.no)}">เปิด</button><button type="button" class="btn del" data-rm="${esc(q.no)}">ลบ</button></div></div>`).join(""):'<p class="sub" style="margin:8px 0 0">ยังไม่มีใบที่บันทึกไว้</p>'}
$("#save").onclick=()=>saveQuote(false);
$("#new").onclick=newQuote;
$("#list").addEventListener("click",e=>{const o=e.target.dataset.open,r=e.target.dataset.rm;
  if(o)openQuote(o);
  if(r&&confirm("ลบใบเสนอราคา "+r+" ?")){putList(getList().filter(x=>x.no!==r));drawList()}});
$("#exp").onclick=()=>{const b=new Blob([JSON.stringify(getList(),null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="anmake-quotes-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;
    const l=getList();arr.forEach(q=>{if(q&&q.no&&Array.isArray(q.items)){const i=l.findIndex(x=>x.no===q.no);if(i>=0)l[i]=q;else l.push(q)}});
    if(putList(l)){drawList();msg("นำเข้าข้อมูลแล้ว")}}catch(err){msg("ไฟล์ไม่ถูกต้อง")}};
renderItems();render();drawList();
</script>
</body>
</html>
